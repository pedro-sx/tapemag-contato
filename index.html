  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("lista-vendedores");
      const vendedores = Array.from(container.querySelectorAll("h2"));

      vendedores.sort((a, b) => {
        const nomeA = a.querySelector("a").textContent.trim().toUpperCase();
        const nomeB = b.querySelector("a").textContent.trim().toUpperCase();
        return nomeA.localeCompare(nomeB);
      });

      container.innerHTML = "";
      vendedores.forEach(v => container.appendChild(v));
    });
  </script>

  <script>
    function filtrarVendedores() {
      const input = document.getElementById('pesquisa');
      const filtro = input.value.toUpperCase();
      const cards = document.querySelectorAll('h2');

      cards.forEach(card => {
        const nome = card.innerText.toUpperCase();
        if (nome.includes(filtro)) {
          card.style.display = "";
        } else {
          card.style.display = "none";
        }
      });
    }
  </script>


  <script>
    let animando = false;
    let estavaPerto = false;
    let lastScrollTop = 0;

    window.addEventListener('scroll', () => {
      const scrollTop = window.scrollY;
      const scrollHeight = document.documentElement.scrollHeight;
      const innerHeight = window.innerHeight;
      const threshold = 5;

      const isNearTop = scrollTop <= threshold;
      const isNearBottom = (scrollTop + innerHeight) >= (scrollHeight - threshold);
      const estaPertoAgora = isNearTop || isNearBottom;

      const rolandoPraBaixo = scrollTop > lastScrollTop;
      const rolandoPraCima = scrollTop < lastScrollTop;
      lastScrollTop = scrollTop;

      if (estaPertoAgora && !estavaPerto && !animando) {
        animando = true;
        estavaPerto = true;

        document.querySelectorAll('h2').forEach(card => {
          card.classList.add('expandido');

          if (rolandoPraCima) {
            card.style.transform = 'scale(1.02) translateY(15px)';
          } else if (rolandoPraBaixo) {
            card.style.transform = 'scale(1.02) translateY(-15px)';
          } else {
            card.style.transform = 'scale(1.02)';
          }
        });

        setTimeout(() => {
          document.querySelectorAll('h2').forEach(card => {
            card.classList.remove('expandido');
            card.style.transform = '';
          });
          animando = false;
        }, 200);
      }

      if (!estaPertoAgora) {
        estavaPerto = false;
      }
    });
  </script>

  <script>
    const botoes = document.getElementById('flutuantes');
    const rodape = document.getElementById('rodape');

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          botoes.classList.add('hidden');
        } else {
          botoes.classList.remove('hidden');
        }
      });
    });

    observer.observe(rodape);
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const glow = document.querySelector('.glow');

      window.addEventListener('mousemove', e => {
        glow.style.left = e.clientX + 'px';
        glow.style.top = e.clientY + 'px';
      });

      window.addEventListener('scroll', () => {
        const scrollTop = window.scrollY;
        const windowHeight = window.innerHeight;
        const docHeight = document.documentElement.scrollHeight;

        const pertoDoTopo = scrollTop <= 150;
        const pertoDoFim = (scrollTop + windowHeight) >= (docHeight - 150);

        if (pertoDoTopo || pertoDoFim) {
          document.querySelectorAll('h2').forEach(card => {
            card.classList.add('expandido');
          });
        } else {
          document.querySelectorAll('h2').forEach(card => {
            card.classList.remove('expandido');
          });
        }
      });
    }
  </script>

  <script>
  const switchInput = document.getElementById('tema-switch');
    const logo = document.getElementById('logo-img');

    function aplicarTema(tema) {
      if (tema === 'claro') {
        document.body.classList.add('claro');
        if (logo) logo.src = 'img/tapemag-pretoP.png';
        switchInput.checked = true;
      } else {
        document.body.classList.remove('claro');
        if (logo) logo.src = 'img/Tapemag-LogotipoW.png';
        switchInput.checked = false;
      }
      localStorage.setItem('tema', tema);
    }

    switchInput.addEventListener('change', () => {
      const temaSelecionado = switchInput.checked ? 'claro' : 'escuro';
      aplicarTema(temaSelecionado);
    });

    window.addEventListener('DOMContentLoaded', () => {
      const temaSalvo = localStorage.getItem('tema');

      if (temaSalvo) {
        aplicarTema(temaSalvo);
      } else {
        const prefereClaro = window.matchMedia('(prefers-color-scheme: light)').matches;
        aplicarTema(prefereClaro ? 'claro' : 'escuro');
      }
    });
  </script>
